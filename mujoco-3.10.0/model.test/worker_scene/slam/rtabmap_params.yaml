# rtabmap_ros 3D 激光 SLAM 参数（纯 lidar，无相机）。
#
# 配合 slam_bridge_3d.py 发布的 /pointcloud (PointCloud2) + /odom + TF 使用。
# 注册策略使用 ICP（Reg/Strategy=1），不依赖视觉特征。
rtabmap:
  ros__parameters:
    # --- 坐标系 ---
    frame_id: base_footprint
    odom_frame_id: odom
    map_frame_id: map
    odom_tf_linear_variance: 0.01
    odom_tf_angular_variance: 0.01

    # --- 订阅配置：纯 3D 点云输入 ---
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_scan: false
    subscribe_scan_cloud: true
    subscribe_stereo: false

    # --- 同步 ---
    approx_sync: true
    approx_sync_max_interval: 0.5
    wait_for_transform: 0.5

    # --- 注册策略：ICP（lidar-only）---
    Reg/Strategy: "1"
    Reg/Force3DoF: "false"

    # --- RGBD/图优化 ---
    RGBD/ProximityBySpace: "true"
    RGBD/ProximityMaxGraphDepth: "0"
    RGBD/ProximityPathMaxNeighbors: "1"
    RGBD/AngularUpdate: "0.05"
    RGBD/LinearUpdate: "0.05"
    RGBD/CreateOccupancyGrid: "true"
    RGBD/NeighborLinkRefining: "true"

    # --- ICP 参数 ---
    Icp/VoxelSize: "0.1"
    Icp/PointToPlane: "true"
    Icp/PointToPlaneK: "20"
    Icp/CorrespondenceRatio: "0.01"
    Icp/PMOutlierRatio: "0.7"
    Icp/Epsilon: "0.001"
    Icp/MaxTranslation: "3.0"
    Icp/MaxCorrespondenceDistance: "1.0"
    Icp/Iterations: "30"

    # --- 内存管理 ---
    Mem/NotLinkedNodesKept: "false"
    Mem/STMSize: "30"
    Mem/LaserScanNormalK: "20"

    # --- 栅格/3D 地图 ---
    Grid/Sensor: "0"
    Grid/CellSize: "0.05"
    Grid/RangeMax: "12.0"
    Grid/RangeMin: "0.2"
    Grid/MaxGroundHeight: "0.04"
    Grid/MaxObstacleHeight: "2.5"
    Grid/NormalsSegmentation: "true"
    Grid/GroundIsObstacle: "false"
    Grid/ClusterRadius: "1.0"
    Grid/3D: "true"

    # --- 3D 点云地图发布 ---
    # 累积所有节点的点云为全局地图
    cloud_output_voxelized: true
    cloud_voxel_size: 0.05
    # 让 rtabmap 更频繁地更新并发布地图
    cloud_decimation: 4
    cloud_max_depth: 12.0
    cloud_min_depth: 0.2
    # 地图组装
    map_filter_radius: 0.0
    map_filter_angle: 30.0
    map_negative_poses_ignored: false
    # 让地图更实时
    map_always_update: true
    publish_last_signature: true
    publish_stats: true
